allowBuilds:
  esbuild: true
  sharp: true

# SECURITY: supply-chain hardening (npm-security-best-practices)
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@educlopez/*"
blockExoticSubdeps: true

# Force patched transitives within the current major for Dependabot alerts.
overrides:
  baseline-browser-mapping: 2.11.30
  esbuild: 0.28.2
  js-yaml: 4.3.2
  nanoid: 3.3.20
  next: 16.4.2
  postcss: 8.5.31
  sharp: 0.35.5
  source-map-js: 1.2.2
